name: Deploy to GitHub Pages

# Content changes made in /admin do NOT need this workflow — the site reads Supabase at runtime.
# This deploys code changes, and refreshes sitemap.xml daily from published projects.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble public files only (no database/, tests/, docs/ or supabase/)
        run: |
          mkdir -p _site
          cp -r index.html project.html 404.html robots.txt admin css js assets _site/
          touch _site/.nojekyll
      - name: Generate sitemap + static project pages from published content
        env:
          OUT_DIR: _site
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/build-seo.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
