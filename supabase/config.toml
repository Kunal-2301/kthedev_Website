# Supabase CLI configuration (only the parts this project relies on).
# These functions are public endpoints with their own validation, rate limiting
# and origin checks; they do not require a user JWT. Admin operations never go
# through them — those use Supabase Auth + RLS directly.
project_id = "kunal-portfolio"

[functions.submit-contact]
verify_jwt = false

[functions.track]
verify_jwt = false

[functions.resume]
verify_jwt = false

[functions.ask]
verify_jwt = false

[auth]
# Admin accounts are created manually; public sign-up must stay disabled.
enable_signup = false
site_url = "https://www.kthedev.com"
additional_redirect_urls = ["https://www.kthedev.com/admin/", "http://localhost:8787/admin/"]
